# /etc/nginx/sites-available/mahai.conf
server {
    listen 80;
    server_name mahai.ir www.mahai.ir;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name mahai.ir www.mahai.ir;

    ssl_certificate     /etc/letsencrypt/live/mahai.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahai.ir/privkey.pem;

    root /var/www/mahai/frontend;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
